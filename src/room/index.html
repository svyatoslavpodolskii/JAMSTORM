<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a222d"><title>JAMSTORM · слушаем вместе</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><main><header><span class="brand">jamstorm<span class="room-dot"></span></span><h1>Твой трек.<br>Наша очередь.</h1><span id="status" role="status">Подключаемся к комнате…</span></header><p id="error" role="alert" hidden></p><div id="toast" role="status" aria-live="polite" hidden></div><div id="guest-now" hidden><img id="guest-cover" alt=""><div><small>Сейчас у хоста</small><strong id="guest-title"></strong><span id="guest-artist"></span></div><button id="guest-play" aria-label="Приостановить">Ⅱ</button></div><nav aria-label="Разделы"><button id="show-queue" class="active" aria-pressed="true">Очередь <span id="total"></span></button><button id="show-search" aria-pressed="false">Найти песню</button></nav><section id="search-section" hidden><h2>Что включим?</h2><form id="search"><label for="query">Название, исполнитель или ссылка YouTube</label><div class="row"><input id="query" type="search" enterkeyhint="search" required maxlength="160" placeholder="Найти любимую песню" autocomplete="off"><button aria-label="Искать"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg></button></div></form><div id="results" aria-live="polite"><p class="empty-hint">Добавляй любимое. По одной песне или целый вечер.</p></div></section><section id="queue-section"><div class="section-heading"><h2>Сейчас и дальше</h2><button id="next" class="quiet" aria-label="Следующий трек">Следующий <span aria-hidden="true">→</span></button></div><button id="add-song" class="add-song"><span aria-hidden="true">＋</span> Добавить песню</button><div id="queue"></div></section><footer>Музыка играет у хоста.<br>Ссылка даёт управление комнатой. Делись ей со своими.</footer></main></body></html>
