name: Build Windows preview
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tunnel:fetch
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: JAMSTORM-Windows-x64
          path: dist/JAMSTORM-*-setup.exe
